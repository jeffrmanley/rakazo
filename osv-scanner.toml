reason = "deepmerge 4.3.1 only via @expo/config (Expo CLI, mobile build tooling); merges app config files, never request input. No fixed release. Revisit with the Expo SDK update."

[[IgnoredVulns]]
id = "GHSA-qr28-fpjm-wq7f"
ignoreUntil = 2026-12-31T00:00:00Z
reason = "decode-uri-component 0.2.2 only via query-string in expo-router (mobile build/runtime of the user's own app); never decodes request input on the server. The fix is the ESM-only 0.5 line, which query-string 7 does not accept. Revisit with the Expo SDK update."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2026-12-31T00:00:00Z
reason = "glob 10/13 via the Expo CLI and e2b's template builder. Neither is called by the server, and the flaw needs an AbortSignal timeout on a glob walk. The fix is glob 14 (a major), which these packages do not accept yet."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-31T00:00:00Z
reason = "minimatch 9/10 via glob (above): patterns come from the packages' own config, never from users, so the amplification DoS is not reachable. The fix is minimatch 11 (a major)."
